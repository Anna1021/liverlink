{% extends 'base_content.html' %}
{% block content %}
{% load static %}
<div class="container card mt-3">
    <h3 class="m-b-50 heading-line pt-3">Notifications</h3>
    <form action="{% url 'clear_notifications' %}" method="post" onsubmit="return confirm('Are you sure you want to clear all?')">
        {% csrf_token %}
        <button class="m-b-50 btn btn-danger btn-sm">Clear all</button>
    </form> 
    <div class="scrollable-container">
        {% for notification in notifications|dictsortreversed:"created" %}
            {% include "partials/notification.html" %}
        {% endfor %}
    </div>
{% endblock %}
