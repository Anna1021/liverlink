<!-- add_comment.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Add Comment</title>
</head>
<body>
    <h1>Add Comment</h1>
    <form method="post" action="{% url 'add_comment' post_id=post.id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="id_content">Content:</label><br>
        <textarea id="id_content" name="content" rows="4" cols="50"></textarea><br>
        <button type="submit">Submit comment</button>
    </form>
</body>
</html>
