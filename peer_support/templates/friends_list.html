<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css'>
<script src='https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.bundle.min.js'></script>
<style>
    .avatar {
        width: 5rem;
        height: 5rem;
        line-height: 2rem;
        border-radius: 50%;
        display: inline-block;
        background: #ced4da no-repeat center/cover;
        position: relative;
        text-align: center;
        color: #868e96;
        font-weight: 600;
        vertical-align: bottom;
    }

    .tile-link {
        position: absolute;
        cursor: pointer;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        z-index: 30;
    }
</style>

{% extends 'base_content.html' %}
{% block content %}
{% load static %}
<div class="container">
    <div class="row">
        {% for friend in friends %}
        <div class="col-md-6 col-xl-4 my-4">
            <div class="card">
                <div class="card-body">
                    <div class="media align-items-center"><span
                            style="background-image: url(https://i.pinimg.com/originals/57/61/5b/57615b8c0092a66c1d4058b1692955cc.gif)"
                            class="avatar mr-3"></span>
                        <div class="media-body overflow-hidden">
                            <h5 class="card-text mb-0">{{ friend.username }}</h5>
                            <p class="card-text text-uppercase subtext">{{ friend.full_name }}</p>
                        </div>
                    </div><a href="#" class="tile-link"></a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
