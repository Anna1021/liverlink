{% extends 'base_content.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-12">
      <h2>Profile settings</h2>
      <div class="col-2 ps-col">
        <div style="padding: 10px"></div>
        <img src="{{ user.gravatar }}" class="ps-gravatar" alt="Your gravatar">   </img>
        <div style="padding: 10px"></div>
        <div class="divider"></div>
        <div style="padding: 5px"></div>
        <ul class="ps-list">
          <li class="ps-list-item"><a class="ps-link" href="{% url 'profile' %}"><i class="bi bi-gear ps-icons"> </i>Personal information</a></li>
          <li class="ps-list-item"><a class="ps-link" href="{% url 'password' %}"><i class="bi bi-lock ps-icons"> </i>Password & security</a></li>
          <li class="ps-list-item"><a class="ps-link" href=""><i class="bi bi-person ps-icons"> </i>Other users</a></li>
          <li class="ps-list-item"><a class="ps-link" href=""><i class="bi bi-bell ps-icons"> </i>Notifications</a></li>
          <li class="ps-list-item"><a class="ps-link" href=""><i class="bi bi-brightness-low ps-icons"> </i>Accessibility</a></li>
        </ul>
      </div>
      <div class="col-8 ps-col">
        {% block title %}{% endblock %}
        <div style="padding: 5px"></div>
        <div class="divider"></div>
        <div style="padding: 5px"></div>
        {% block page %}
        {% endblock %}
      </div>
      <div class="col-2 ps-col"></div>
    </div>
  </div>
  <row> <!-- footer -->
    <div style="padding: 40px;"></div>
  </row>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    var unblockUserUrl = "{% url 'unblock_user' 0 %}";
    var blockUserUrl = "{% url 'block_user' 0 %}";
    var friendRequestUserUrl = "{% url 'send_friend_request' 0 %}"
    var removeFriendUrl = "{% url 'remove_friend' 0 %}"
</script>
<script src="{% static 'js/profile.js' %}"></script>

{% endblock %}
