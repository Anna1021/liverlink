{% extends 'partials/conversation_menu.html' %}
{% load static %}
{% block convo %}

<div class="conversation-details">
            <h3>{{conversation}}</h3>
        <div>
        <div class="row user-list-header">
            <div class="col-md-7">
                <h4>Members:</h4>
            </div>
            {% include 'partials/add_users.html' %}
            
        </div>
        <ul class="user-list">
            {% for user in conversation.users.all %}
                <li><a class="btn user-card" href="{% url 'profile' user.username %}">{{ user }}</a></li>
            {% endfor %}
        </ul>
    </div>
</div>

{% endblock %}
