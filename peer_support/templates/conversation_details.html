{% extends 'partials/conversation_menu.html' %}
{% load static %}
{% block convo %}

<div class="conversation-details">
            <h3>{{conversation}}</h3>
        <div>
        <div class="row user-list-header">
            <div class="col-md-7">
                <h4>Members:</h4>
            </div>
            {% include 'partials/add_users.html' %}
            
        </div>
        <ul class="user-list notranslate">
            {% for user in conversation.users.all %}
                <li><a class="btn user-card" href="{% url 'profile' user.username %}">{{ user }}</a></li>
            {% endfor %}
        </ul>

        <div class="cnav-item dropdown d-flex justify-content-center">
            <a class="nav-link btn btn-danger" href="#" id="leave-group-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Leave group
            </a>
            <ul class="dropdown-menu dropdown-menu-end leave-confirmation" aria-labelledby="leave-group-dropdown">
                <li><a href="{% url 'leave_conversation' conversation.id %}" class="btn btn-outline-danger d-flex justify-content-center">Confirm</a></li>
            </ul>
        </div>
    </div>
</div>

{% endblock %}
