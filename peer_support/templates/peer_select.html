{% extends 'dashboard.html' %}
{% block page %}
{% load static %}
<div class="container">
    <div id="friend-card" class="shadow box-area my-2">
        <h2>Add friend</h2>
        <hr>
        <div class="row">
            {% include 'partials/search_filter_sort_users.html' %}
        </div>
        <div style="overflow-y:auto;">
            <hr style="margin-top: 0;">
            {% if users|length == 0 %}
            <p>No users</p>
            {% else %}
            <div class="container my-2">
                <div class="row">
                    {% for user in users %}
                        {% include "partials/peer_selection_user.html" %}
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    var sendFriendRequestUrl = "{% url 'send_friend_request' 0 %}";
</script>
<script src="{% static 'js/peer_select.js' %}"></script>
{% endblock %}
