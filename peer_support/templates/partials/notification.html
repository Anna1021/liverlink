<div class="notification-list d-flex justify-content-between">
    <div class="notification-list_content">
        <div class="notification-list_img">
            <a
            {% if notification.title == 'Friend Request' %}
             href="{% url 'profile' notification.friend_request.sender.username %}" aria-label="user-profile-hyperlink"
            {% elif  notification.title == 'New conversation' %}
             href="{% url 'conversation' 0 %}" aria-label="conversation-hyperlink"
            {% endif %}
            >
            <img src="https://www.icegif.com/wp-content/uploads/2022/01/icegif-788.gif" alt="user">
            </a>
        </div>
        <div class="notification-list_detail">
            <p><b>{{ notification.title }}</b></p>
            <p class="subtext">{{ notification.description }}</p>
            <p class="subtext"><small>{{ notification.created }}</small></p>
        </div>
    </div>
    <div class="d-flex align-items-center">
        {% if notification.title == 'Friend Request' %}
            <button class="btn btn-success accept-request" onclick="window.location.href='/accept_friend_request/{{ notification.friend_request.id }}/{{ notification.id }}';"><i class="bi bi-check"></i></button>
            &nbsp;
        {% endif %}
        <button class="btn btn-danger decline" onclick="window.location.href='/delete_notification/{{ notification.id }}';"><i class="bi bi-x"></i></button>
    </div>
</div>
