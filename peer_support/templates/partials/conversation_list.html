{% load conversation_tags %}
<button
        class="navbar-toggler btn"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#conversation-list"
        aria-controls="conversationList"
        aria-expanded="false"
        aria-label="List of conversations">
        <span class="navbar-toggler-icon"></span>
      </button>
<nav class="col-md-3 d-md-block sidebar collapse navbar-collapse pb-3" id="conversation-list">
<ul class="conversation-list">
    {% for conversation in user_conversations %}
    <li>
    <a href="{% url 'conversation' conversation.id %}" class="btn conversation-btn conversation-name conversation-card notranslate">
        {% conversation_name user conversation %}
    </a>
    {% empty %}
    <div class="no-conversations">No conversations!</div>
    </li>
    {% endfor %}
</ul>
<a href="{% url 'create_conversation' %}" class="text-center fs-3"><i class="bi-pencil-square"></i></a>
</nav>
