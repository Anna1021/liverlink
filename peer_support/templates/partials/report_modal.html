<div class="modal fade" id="{{report_type}}_{{object_id}}" tabindex="-1" aria-labelledby="report_item" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content card">
          <div class="modal-header">
            <h5 class="modal-title">Report</h5>
            <button type="button" class="btn-close btn-outline-light btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form method="post" class="px-4 py-3" novalidate>
                {% csrf_token %}
                {% include 'partials/bootstrap_form.html' with form=report_form %}
                <input type="hidden" name="action" value="{{ object_id }}">
                <button class="btn btn-primary" type="submit" name="{{ report_type }}">Report</button>
            </form>
          </div>
        </div>
    </div>
</div>
