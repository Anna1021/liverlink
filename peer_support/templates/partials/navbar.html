{% load static %}
<div class="select-theme">
  <nav id="top-nav" class="navbar navbar-expand-lg navbar-dark ">
    <div class="container">
      <a class="navbar-brand" href="{% url 'feed' %}">
        <img
          src="{% static 'images/white-liver-link-logo-no-text.png' %}"
          alt="LiverLink logo"
          class="img-fluid"
          style = "width: 35px;"
        />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="google_translate_element"></div>
      {% if user.is_authenticated %} {% include 'partials/menu.html' %} 
      {% endif %}
    </div>
  </nav>
</div>

<script src="{% static 'js/google_translation.js' %}" type="text/javascript"></script>
