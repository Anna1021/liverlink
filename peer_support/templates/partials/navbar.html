{% load static %}


<div class="select-theme">
  <nav id="top-nav" class="navbar navbar-expand-lg navbar-dark ">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">
        <img
          src="{% static 'images/pulseLogoCropped.png' %}"
          alt="Pulse logo"
          class="img-fluid"
        />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <select
        id="theme"
        class="theme_toggle"
        style="width: auto; margin-left: auto"
      >
        <option value="light-theme">Light</option>
        <option value="dark-theme" selected>Dark</option>
      </select>
      <div id="google_translate_element"></div>
      {% if user.is_authenticated %} {% include 'partials/menu.html' %} 
      {% endif %}
    </div>
  </nav>
  

  <script src="{% static 'js/google_translation.js' %}"></script>
</div>
