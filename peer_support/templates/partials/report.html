{% load reporting_tags %}
<div class="friend-inner-card col-12 row mt-2 mb-3 pb-2 ml-1">
    <div class="col-11">
        <p>Reason: {{ report.reason }}</p>
        <p>Reported At: {{ report.reported_at }}</p>
        <p>Content Type: {{ report.content_type|split:"| " | last }}</p>
        <p>Reported Content: {% display_reported_content report %}</p>
    </div>
    <div class="col-1 my-auto">
        <button class="btn btn-success accept-request" onclick="window.location.href='/accept_report/{{report.id}}';"><i class="bi bi-check"></i></button>
        &nbsp;
        <button class="btn btn-danger decline" onclick="window.location.href='/decline_report/{{ report.id }}';"><i class="bi bi-x"></i></button>
    </div>
</div>
