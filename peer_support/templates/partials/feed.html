<!--feed-->
<div class="container">
    <div class="row">
      <div class="col-sm-12 col-md-6 offset-md-3">
        <h1>Feed</h1>
        <!-- Add content specific to your feed page here -->
        {% for post in posts %}
          <div class="post">
            <h3>{{ post.title }}</h3>
            <p>{{ post.text }}</p>
            <a href="{% url 'post_detail' post_id=post.id %}">View Post</a>
          </div>
        {% empty %}
        <p>No posts available.</p>
        {% endfor %}
      </div>
    </div>
  </div>
