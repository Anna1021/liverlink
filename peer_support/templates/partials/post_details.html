{% load profanity %}
{% load static %}
<div class="post-header d-flex align-items-center">
    <a href="{% url 'profile' post.author.username %}">
        <img src="{% static post.author.userprofile.profile_picture %}" alt="Profile Picture" class="rounded-circle friend-profile-picture ml-3 mr-3" style="width: 70px; height: 70px;">
    </a>
    </a>
    <a href="{% url 'profile' post.author.username %}">
        <h4 class="font-weight-bold pt-1 mb-0">{{ post.author }}</h4>
    </a>
</div>
<div class="card-body">
    <p>{{ post.text |censor}}</p>
    <p>{{ post.created_at }}</p>
    {% if post.author == request.user %}
        <a href="{% url 'delete_post' post_id=post.id %}" class="btn-danger btn" style = "border-color: #dc3545;">Delete</a>
    {% endif %}
    {% if from_feed %}
        <a href="{% url 'post_detail' post_id=post.id %}" class="btn btn-info" style = "border-color: #0dcaf0;">View Post</a>
    {% endif %}
</div>
