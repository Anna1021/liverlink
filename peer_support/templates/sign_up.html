{% extends 'base_content.html' %}
{% load static %}
{% block content %}
{% load static %}
<div id="cover-image">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
      <div id="loginBox" class="row p-3 text-white shadow box-area custom-rounded my-3" style="background-color:#2E2D38">

      <!-- Left box image -->
      {% include 'partials/cover_image.html' %}

      <!-- Right box form -->
      <div class="col-md-7">
        <div class="row align-items-center">
          <h1>Sign up</h1>
            <form action="{% url 'sign_up' %}" method="post">
              {% csrf_token %}
              {% include 'partials/bootstrap_form.html' with form=form %}
              <p>Already have an account? <a href='{% url 'log_in' %}'>
                Log in here
              </a> </p>
              <input type="submit" value="Sign up" class="btn btn-primary">
            </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="{% static 'js/sign_up.js' %}"></script>
{% endblock %}
